<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
		<title>jQuery UI Example Page</title>
		<link type="text/css" href="css/vader/jquery-ui-1.8.22.custom.css" rel="stylesheet" />
		<script type="text/javascript" src="js/jquery-1.7.2.min.js"></script>
		<script type="text/javascript" src="js/jquery-ui-1.8.22.custom.min.js"></script>
		<script type="text/javascript">
			$(function()
			{

				// Accordion
				$("#accordion").accordion({ header: "h3" });

				// Tabs
				$('#[id^=tabs]').tabs();	// Regex to select any element starting with a certain name.

				// Dialoge
				$('#dialog').dialog(
				{
					autoOpen: false,
					width: 600,
					buttons: {
						"Ok": function() 
						{
							$(this).dialog("close");
						},
						"Cancel": function() 
						{
							$(this).dialog("close");
						}
					}
				});

				// Dialog Link
				$('#dialog_link').click(function()
				{
					$('#dialog').dialog('open');
					return false;
				});

				// Datepicker
				$('#datepicker').datepicker(
				{
					inline: true
				});

				// Slider
				$('#slider').slider(
				{
					range: false,
					value: 50,
					step: 4,
					min: 0,
					max: 100,
					orientation: "horizontal"
				});

				// Progressbar
				$("#progressbar").progressbar(
				{
					value: 20
				});

				//hover states on the static widgets
				$('#dialog_link, ul#icons li').hover(
					function() { $(this).addClass('ui-state-hover'); },
					function() { $(this).removeClass('ui-state-hover'); }
				);

				$('#button').button();

				$('#radioset').buttonset();

				var ConsoleAutoCompleteData = [];
				$('#console_input').autocomplete(
				{
					source: ConsoleAutoCompleteData,
					position: { my: "left top", 
						        at: "left bottom",
						        collision: "none" }
				});
				
				/* This selects all non-input elements and makes them unselectable */
				$("*:not(input)").addClass("unselectable");
				
				var InputHistory = [""];
				var InputHistoryIdx = 0;
				$("#console_input").keyup(function(event)
				{
                    if(event.keyCode == 13) // On enter...
                    {
                        if (this.value != '')
                        {                            
                            Console.Execute(this.value);                            
                            
                            // Add the input to the input history.
                            InputHistory.push(this.value);
                            InputHistoryIdx = InputHistory.length;
                            
                            this.value = '';
                        }
                    }
                    // Up and down arrows are already used by the autocomplete feature.
                    else if (event.keyCode == 38)
                    {
                        InputHistoryIdx--;
                        if (InputHistoryIdx < 0)
                        {
                            InputHistoryIdx = 0;
                        }
                        this.value = InputHistory[InputHistoryIdx];
                    }
                    else if (event.keyCode == 40)
                    {
                        InputHistoryIdx++;
                        if (InputHistoryIdx >= InputHistory.length)
                        {
                            InputHistoryIdx = InputHistory.length - 1;
                        }
                        this.value = InputHistory[InputHistoryIdx];
                    }
                });
                
			    /*$("#progressbar").progressbar('value', 50);*/
			});
        </script>
		<style type="text/css">
			/*demo page css*/
			body{ font: 62.5% "Trebuchet MS", sans-serif; margin: 0px; background-color: transparent;}
			.demoHeaders { margin-top: 2em; }
			#dialog_link {padding: .4em 1em .4em 20px;text-decoration: none;position: relative;}
			#dialog_link span.ui-icon {margin: 0 5px 0 0;position: absolute;left: .2em;top: 50%;margin-top: -8px;}
			ul#icons {margin: 0; padding: 0;}
			ul#icons li {margin: 2px; position: relative; padding: 4px 0; cursor: pointer; float: left;  list-style: none;}
			ul#icons span.ui-icon {float: left; margin: 0 4px;}

			/* Used to make stuff unselectable */
			.unselectable
			{
			-webkit-user-select: none;
			-moz-user-select: none;
			user-select: none;
			}
			
			input:focus
			{
                outline: none;
            }
		</style>
	</head>
	<body>
	    <table id="console_container" style="position: relative; padding: 5px; padding-right: 12px; margin: 0px; border: 0px; width: 100%; heigth: 300px; background-color: #1e2f39; opacity: 0.9;">
	        <tr id="console_textarea_container">
	            <td>
	                <textarea id="console_textarea" cols="128" rows="10" style="resize: none; position: relative; width: 100%; font-family: Consolas; font-size: medium;"></textarea>
	            </td>
	        </tr>
		    <tr>
		        <td>
			        <input id="console_input" autofocus style="z-index: 100; position: relative; width: 100%; color: #cccccc; font-family: Consolas; font-size: medium;" 
				        value='Enter a command'
				        onblur="if (this.value == '') {this.value = 'Enter a command'; this.style.color = '#cccccc';}"
				        onfocus="if (this.value == 'Enter a command') {this.value = ''; this.style.color = '#000000'}" />
			    </td>
		    </tr>
        </table>
	</body>
</html>
